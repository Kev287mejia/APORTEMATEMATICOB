<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un Aporte Matemático — Lector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at center, #2c2f33 0%, #111214 100%);
    font-family: 'Source Serif 4', Georgia, serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 18px 24px;
    z-index: 20;
  }

  .lang-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #f2ece0;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-family: sans-serif;
    font-size: 0.78em;
    letter-spacing: 0.03em;
  }

  .lang-btn.active {
    background: #c17a4d;
    border-color: #c17a4d;
    color: #1c1a17;
    font-weight: 600;
  }

  .container {
    flex: 1 1 auto;
    min-height: 0;
    width: 90vw;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .book-wrap { width: 100%; height: 100%; display: none; }
  .book-wrap.active { display: flex; justify-content: center; align-items: center; }

  .page {
    background-color: #fdfcf9;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.06);
    width: 461px;
    height: 640px;
    padding: 44px 40px 34px;
    display: flex;
    flex-direction: column;
  }

  .page.--cover {
    background-color: #1c1a17;
    color: #f2ece0;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 40px;
  }

  .page.--cover h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5em;
    line-height: 1.4;
    font-weight: 700;
  }

  .page-body {
    flex: 1;
    min-height: 0;
    font-size: 15px;
    line-height: 1.6;
    color: #2b2822;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-right: 4px;
  }

  .page-body::-webkit-scrollbar { width: 5px; }
  .page-body::-webkit-scrollbar-thumb { background: #d8cfbc; border-radius: 3px; }

  .page-body p {
    margin-bottom: 12px;
    text-align: justify;
  }

  .page-body .chapterTitle {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.25em;
    line-height: 1.3;
    color: #1c1a17;
    margin-bottom: 16px;
    text-align: left;
  }

  .page-body .sectionTitle {
    font-weight: 600;
    color: #c17a4d;
    margin-bottom: 10px;
    text-align: left;
  }

  .page-number {
    text-align: center;
    font-size: 0.68em;
    color: #a39c8e;
    font-style: italic;
    margin-top: 10px;
  }

  .controls {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 14px 0 22px;
    z-index: 20;
  }

  button.nav {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #f2ece0;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: sans-serif;
    font-size: 0.85em;
  }

  button.nav:hover { background: rgba(255,255,255,0.16); }
</style>
</head>
<body>

<div class="topbar">
  <button class="lang-btn active" id="btnES">ES LECTOR DIGITAL</button>
  <button class="lang-btn" id="btnEN">EN DIGITAL READER</button>
</div>

<div class="container">
  <div class="book-wrap active" id="wrapES"><div id="bookES"></div></div>
  <div class="book-wrap" id="wrapEN"><div id="bookEN"></div></div>
</div>

<div class="controls">
  <button class="nav" id="prevBtn">← Anterior / Prev</button>
  <button class="nav" id="nextBtn">Siguiente / Next →</button>
</div>

<!-- Datos extraídos de los PDF: 168 páginas cada idioma -->
<script src="pages_es.js"></script>
<script src="pages_en.js"></script>

<script>
  // COVER_PAGES: define manualmente qué páginas son "tapa" (portada/contraportada).
  // Ajusta estos índices (0-based) según cómo quieras que se vean tus tapas.
  const coverIndexes = [0, 167];

  function renderPage(p, index) {
    if (coverIndexes.includes(index)) {
      const titleText = p.blocks.map(b => b.text).join(' ');
      return `<div class="page --cover"><h1>${titleText}</h1></div>`;
    }
    const body = p.blocks.map(b => {
      if (b.type === 'chapterTitle') return `<div class="chapterTitle">${b.text}</div>`;
      if (b.type === 'sectionTitle') return `<div class="sectionTitle">${b.text}</div>`;
      return `<p>${b.text}</p>`;
    }).join('');
    return `
      <div class="page">
        <div class="page-body">${body}</div>
        <div class="page-number">${p.pageNumber || ''}</div>
      </div>
    `;
  }

  // Reduce el tamaño de letra de una página hasta que TODO el texto quepa
  // sin cortarse, en vez de depender del scroll (que compite con el gesto
  // de arrastrar para pasar la hoja).
  function autoFitPage(pageBodyEl) {
    let size = 15;
    const minSize = 8.5; // no baja de aquí para que siga siendo legible
    pageBodyEl.style.fontSize = size + 'px';
    while (pageBodyEl.scrollHeight > pageBodyEl.clientHeight && size > minSize) {
      size -= 0.5;
      pageBodyEl.style.fontSize = size + 'px';
    }
  }

  function buildBook(containerId, pagesData, pageWidth, pageHeight) {
    const el = document.getElementById(containerId);
    el.innerHTML = pagesData.map(renderPage).join('');
    // Aplicamos el tamaño real ANTES de medir, si no, el autoajuste se
    // calcularía contra el tamaño fijo del CSS (461x640) en vez del
    // tamaño real que va a usar StPageFlip.
    el.querySelectorAll('.page').forEach(p => {
      p.style.width = pageWidth + 'px';
      p.style.height = pageHeight + 'px';
    });
    el.querySelectorAll('.page:not(.--cover) .page-body').forEach(autoFitPage);
    const pf = new St.PageFlip(el, {
      width: pageWidth,
      height: pageHeight,
      size: "fixed",       // tamaño fijo, calculado a mano abajo — "stretch" desbordaba el contenedor
      showCover: true,
      maxShadowOpacity: 0.5,
      drawShadow: true,
      flippingTime: 900,
      usePortrait: true,
      useMouseEvents: true,
      swipeDistance: 30
    });
    pf.loadFromHTML(el.querySelectorAll('.page'));
    return pf;
  }

  let pfES, pfEN, activeLang = 'ES';

  function initBooks() {
    // Medimos el espacio REAL disponible (el contenedor, no la librería) para
    // que la página nunca sea más alta de lo que cabe en pantalla.
    const containerEl = document.querySelector('.container');
    const availW = containerEl.clientWidth;
    const availH = containerEl.clientHeight;
    const pageHeight = Math.max(300, Math.floor(availH));
    const pageWidth = Math.max(220, Math.floor(availW / 2) - 4);

    document.getElementById('bookES').innerHTML = '';
    document.getElementById('bookEN').innerHTML = '';

    pfES = buildBook('bookES', pagesES, pageWidth, pageHeight);
    pfEN = buildBook('bookEN', pagesEN, pageWidth, pageHeight);
  }

  // Esperamos a que cargue todo (incluida la fuente) antes de medir el
  // contenedor, para no calcular un tamaño incorrecto a mitad de carga.
  window.addEventListener('load', initBooks);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(initBooks, 250);
  });

  function setLang(lang) {
    activeLang = lang;
    document.getElementById('wrapES').classList.toggle('active', lang === 'ES');
    document.getElementById('wrapEN').classList.toggle('active', lang === 'EN');
    document.getElementById('btnES').classList.toggle('active', lang === 'ES');
    document.getElementById('btnEN').classList.toggle('active', lang === 'EN');
  }

  document.getElementById('btnES').addEventListener('click', () => setLang('ES'));
  document.getElementById('btnEN').addEventListener('click', () => setLang('EN'));

  document.getElementById('nextBtn').addEventListener('click', () => {
    (activeLang === 'ES' ? pfES : pfEN).flipNext();
  });
  document.getElementById('prevBtn').addEventListener('click', () => {
    (activeLang === 'ES' ? pfES : pfEN).flipPrev();
  });
</script>

</body>
</html>
