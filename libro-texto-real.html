<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Libro — Texto Real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at center, #2c2f33 0%, #111214 100%);
    font-family: 'Source Serif 4', Georgia, serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 90vw;
    height: 85vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #book {
    width: 100%;
    height: 100%;
  }

  .page {
    background-color: #fdfcf9;
    overflow: hidden;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.06);
    width: 461px;
    height: 640px;
    padding: 48px 44px 38px;
    display: flex;
    flex-direction: column;
  }

  .page.--cover {
    background-color: #1c1a17;
    color: #f2ece0;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 40px;
  }

  .page.--cover h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7em;
    line-height: 1.35;
    font-weight: 700;
  }

  .page.--cover p {
    margin-top: 18px;
    font-size: 0.85em;
    opacity: 0.75;
    letter-spacing: 0.05em;
  }

  .page-chapter-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.35em;
    line-height: 1.3;
    color: #1c1a17;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin-bottom: 26px;
  }

  .page-section-label {
    color: #c17a4d;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.4em;
    margin-right: 6px;
  }

  .page-body {
    flex: 1;
    font-size: 0.92em;
    line-height: 1.75;
    color: #2b2822;
    overflow: hidden;
  }

  .page-body p {
    margin-bottom: 14px;
    text-align: justify;
  }

  .page-number {
    text-align: center;
    font-size: 0.72em;
    color: #a39c8e;
    font-style: italic;
    margin-top: 12px;
  }

  .controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
  }

  button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #f2ece0;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: sans-serif;
    font-size: 0.85em;
  }

  button:hover { background: rgba(255,255,255,0.16); }
</style>
</head>
<body>

<div class="container">
  <div id="book">
    <!-- Las páginas se inyectan vía JS a partir de chapters[] -->
  </div>
</div>

<div class="controls">
  <button id="prevBtn">← Anterior</button>
  <button id="nextBtn">Siguiente →</button>
</div>

<script>
  // ---------------------------------------------------------------
  // CONTENIDO: cada objeto es UNA página física del libro.
  // Reemplaza esto con el contenido real, capítulo por capítulo.
  // Si un capítulo es largo, divídelo en varios objetos (una página
  // cabe aprox. 700-900 caracteres con este tamaño de fuente).
  // ---------------------------------------------------------------
  const pages = [
    {
      cover: true,
      title: "Un Aporte Matemático<br>en el Siglo 21",
      subtitle: "Factorización de a² + b², en los Números Reales"
    },
    {
      chapterTitle: 'Capítulo 1: "Algo que se dice de las Matemáticas."',
      sectionLabel: "1.1",
      sectionTitle: "Leyes matemáticas rigen lo material e inmaterial que no se ve.",
      paragraphs: [
        "En mi opinión: el hombre desde que fue creado, recibió la asignación de reproducirse, cuidar su medio ambiente, y nombrar a los animales y objetos a su alrededor.",
        "Además, pienso que se le dotó del lenguaje, libre albedrío, capacidad de razonamiento, uso del sentido común y que fue diseñado con un programa neuronal matemático instalado en su cerebro que le permite ver en su entorno patrones de todo tipo."
      ],
      pageNumber: 1
    },
    {
      chapterTitle: 'Capítulo 1: "Algo que se dice de las Matemáticas."',
      paragraphs: [
        "El hombre tiene en su cerebro una inmensa red neuronal, que hace que su cerebro actúe como una súper computadora biológica sustentada por una energía biológica-electro-química, con una memoria expandible.",
        "Aquí es donde se aloja la misteriosa mente humana, con su programa neuro-matemático, que le permite, después de ver y observar las estructuras y patrones de su entorno: pensar, razonar, analizar y comparar."
      ],
      pageNumber: 2
    },
    {
      cover: true,
      title: "Fin",
      subtitle: ""
    }
  ];

  const bookElement = document.getElementById('book');

  function renderPage(p) {
    if (p.cover) {
      return `
        <div class="page --cover">
          <h1>${p.title}</h1>
          <p>${p.subtitle}</p>
        </div>
      `;
    }
    const sectionHeader = p.sectionLabel
      ? `<span class="page-section-label">${p.sectionLabel}</span>${p.sectionTitle || ''}<br><br>`
      : '';
    return `
      <div class="page">
        <div class="page-chapter-title">${p.chapterTitle || ''}</div>
        <div class="page-body">
          ${sectionHeader}
          ${(p.paragraphs || []).map(t => `<p>${t}</p>`).join('')}
        </div>
        <div class="page-number">${p.pageNumber || ''}</div>
      </div>
    `;
  }

  bookElement.innerHTML = pages.map(renderPage).join('');

  const pageFlip = new St.PageFlip(bookElement, {
    width: 461,
    height: 640,
    size: "stretch",
    minWidth: 300,
    maxWidth: 900,
    minHeight: 420,
    maxHeight: 1200,
    showCover: true,
    maxShadowOpacity: 0.5,
    drawShadow: true,
    flippingTime: 900,
    usePortrait: true,
    useMouseEvents: true,
    swipeDistance: 30
  });

  pageFlip.loadFromHTML(document.querySelectorAll('.page'));

  document.getElementById('nextBtn').addEventListener('click', () => pageFlip.flipNext());
  document.getElementById('prevBtn').addEventListener('click', () => pageFlip.flipPrev());
</script>

</body>
</html>
