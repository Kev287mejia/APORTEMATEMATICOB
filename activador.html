<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Activación — Aporte Matemático</title>
  <link rel="icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Josefin+Sans:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  
  <!-- ExcelJS para exportar archivos Excel con estilos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    .admin-card {
      background: #fff;
      border: 1px solid rgba(250, 171, 159, 0.4);
      padding: 35px 30px;
      max-width: 600px;
      margin: 40px auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    .code-display {
      background: #fdfaf6;
      border: 2px dashed #D38D45;
      padding: 20px;
      text-align: center;
      margin: 20px 0;
      display: none;
    }
    .code-value {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #D38D45;
      letter-spacing: 2px;
      margin: 10px 0;
    }
    .msg-preview {
      background: #f9f9f9;
      border-left: 3px solid #25D366;
      padding: 15px;
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      color: #333;
      text-align: left;
      white-space: pre-wrap;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .btn-copy {
      background: #25D366;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 700;
      width: 100%;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .btn-copy:hover { background: #128C7E; }
    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-family: 'Josefin Sans', sans-serif;
      font-size: 0.8rem;
    }
    .history-table th, .history-table td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    .history-table th {
      background: #fafafa;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body style="background: var(--color-bg); padding: 20px;">

  <div class="admin-card">
    <div class="SpecialHeading text-center mb-20">
      <h1 style="font-family: var(--font-heading); font-size: 1.4rem; color: #333;">Generador de Claves de Acceso</h1>
      <div class="special-subtitle">Panel Privado para Clientes de Kash / Transferencia</div>
      <div class="special-subtitle-line" style="margin: 0.8rem auto 1rem;"></div>
    </div>

    <form id="genForm" onsubmit="generateActivationCode(event)">
      <div class="form-group" style="margin-bottom: 15px;">
        <label style="font-family: var(--font-ui); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #666; display: block; margin-bottom: 5px;">Nombre del Comprador</label>
        <input type="text" id="buyerName" placeholder="Ej: Juan Pérez" required style="width:100%; padding:10px; border:1px solid #ddd; font-family: var(--font-body);" />
      </div>
      <div class="form-group" style="margin-bottom: 20px;">
        <label style="font-family: var(--font-ui); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #666; display: block; margin-bottom: 5px;">Teléfono / WhatsApp (Opcional)</label>
        <input type="tel" id="buyerPhone" placeholder="Ej: 8888-0000" style="width:100%; padding:10px; border:1px solid #ddd; font-family: var(--font-body);" />
      </div>
      <div class="form-group" style="margin-bottom: 20px;">
        <label style="font-family: var(--font-ui); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #666; display: block; margin-bottom: 5px;">Idioma Comprado</label>
        <select id="buyerLang" style="width:100%; padding:10px; border:1px solid #ddd; font-family: var(--font-body);">
          <option value="ES">Solo Español</option>
          <option value="EN">Solo Inglés</option>
          <option value="ALL">Ambos (Bundle)</option>
        </select>
      </div>
      <button type="submit" class="shortcode-button btn btn-color" style="width:100%; justify-content: center; padding: 12px;">
        <span>Generar Código de Desbloqueo</span>
      </button>
    </form>

    <!-- Display area -->
    <div class="code-display" id="codeDisplay">
      <div style="font-family: var(--font-ui); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #888;">Código Único Generado:</div>
      <div class="code-value" id="codeValue">MAT-XXXX-XXXX</div>
      
      <div class="msg-preview" id="msgPreview"></div>

      <button class="btn-copy" onclick="copyMessage()" style="display:inline-flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copiar Mensaje para WhatsApp
      </button>
      <a id="btnSendWa" href="#" target="_blank" class="shortcode-button btn btn-normal" style="width:100%; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        <span>Abrir Chat de WhatsApp</span>
      </a>
    </div>

    <!-- History -->
    <div style="margin-top: 35px; border-top: 1px solid #eee; padding-top: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="font-family: var(--font-heading); font-size: 1rem; color: #333; margin: 0;">Últimos Códigos Generados</h3>
        <button onclick="exportToExcel()" style="background: #D38D45; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-family: var(--font-ui); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 5px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Descargar Excel
        </button>
      </div>
      <table class="history-table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Código</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="3" style="text-align:center; color:#999;">No hay códigos generados aún.</td></tr>
        </tbody>
      </table>
    </div>

    <div style="text-align: center; margin-top: 25px;">
      <a href="index.html" style="font-family: var(--font-ui); font-size: 0.75rem; color: #999; text-decoration: none;">&larr; Volver a la página principal</a>
    </div>
  </div>

  <script>
    var currentMessage = '';

    function makeRandomChunk(len) {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var res = '';
      for (var i = 0; i < len; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return res;
    }

    function generateActivationCode(e) {
      e.preventDefault();
      var name = document.getElementById('buyerName').value.trim();
      var phone = document.getElementById('buyerPhone').value.trim();
      var lang = document.getElementById('buyerLang').value;
      
      // Formato MAT-LANG-XXXX-YYYY
      var code = 'MAT-' + lang + '-' + makeRandomChunk(4) + '-' + makeRandomChunk(4);
      
      document.getElementById('codeValue').textContent = code;
      
      var langText = (lang === 'ES') ? 'Español' : (lang === 'EN') ? 'Inglés' : 'Español e Inglés';
      currentMessage = '¡Hola ' + name + '! Muchas gracias por tu compra del libro digital "Un Aporte Matemático en el Siglo 21" (Versión: ' + langText + ').\n\n'
        + '🔑 Tu Código de Acceso es: *' + code + '*\n\n'
        + '📖 Para desbloquearlo:\n'
        + '1. Entra a nuestra página web.\n'
        + '2. Toca "Comprar Libro Digital" o entra a cualquier capítulo.\n'
        + '3. Haz clic en "¿Ya compraste este libro? Restaurar acceso".\n'
        + '4. Pega tu código: ' + code + '\n\n'
        + '¡Que disfrutes la lectura!';

      document.getElementById('msgPreview').textContent = currentMessage;
      document.getElementById('codeDisplay').style.display = 'block';

      // WhatsApp direct link
      var cleanPhone = phone.replace(/[^0-9]/g, '');
      if (cleanPhone.length === 8) cleanPhone = '505' + cleanPhone;
      var waUrl = cleanPhone 
        ? ('https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent(currentMessage))
        : ('https://wa.me/?text=' + encodeURIComponent(currentMessage));
      document.getElementById('btnSendWa').href = waUrl;

      // Save to history
      saveToHistory(name, phone, langText, code);
    }

    function copyMessage() {
      if (!navigator.clipboard) {
        var ta = document.createElement('textarea');
        ta.value = currentMessage;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      } else {
        navigator.clipboard.writeText(currentMessage);
      }
      alert('¡Mensaje copiado al portapapeles! Ahora puedes pegarlo en el chat de WhatsApp de tu cliente.');
    }

    function saveToHistory(name, phone, lang, code) {
      try {
        var list = JSON.parse(localStorage.getItem('aporte_code_history') || '[]');
        list.unshift({
          date: new Date().toLocaleDateString('es-NI') + ' ' + new Date().toLocaleTimeString('es-NI', {hour: '2-digit', minute:'2-digit'}),
          name: name,
          phone: phone || 'N/A',
          lang: lang,
          code: code
        });
        if (list.length > 1000) list = list.slice(0, 1000);
        localStorage.setItem('aporte_code_history', JSON.stringify(list));
        renderHistory();
      } catch (err) {}
    }

    function renderHistory() {
      try {
        var list = JSON.parse(localStorage.getItem('aporte_code_history') || '[]');
        var tbody = document.getElementById('historyBody');
        if (!list.length) return;
        tbody.innerHTML = '';
        list.forEach(function(item) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + item.date + '</td><td>' + item.name + '</td><td><strong>' + item.code + '</strong></td>';
          tbody.appendChild(tr);
        });
      } catch (err) {}
    }

    async function exportToExcel() {
      try {
        var list = JSON.parse(localStorage.getItem('aporte_code_history') || '[]');
        if (!list.length) {
          alert('No hay registros para descargar.');
          return;
        }

        const workbook = new ExcelJS.Workbook();
        workbook.creator = 'Aporte Matemático';
        const sheet = workbook.addWorksheet('Registros', {
          views: [{ showGridLines: false }] // Clean look
        });

        // Column widths
        sheet.columns = [
          { key: 'colA', width: 3 }, // Buffer column
          { key: 'date', width: 22 },
          { key: 'name', width: 35 },
          { key: 'phone', width: 20 },
          { key: 'lang', width: 22 },
          { key: 'code', width: 28 },
          { key: 'notes', width: 25 }, // ESTADO / NOTAS
          { key: 'dashLabel', width: 18 },
          { key: 'dashVal', width: 12 }
        ];

        // 1. Calculate totals
        let countES = 0, countEN = 0, countALL = 0;
        list.forEach(i => {
          if (i.lang === 'Español') countES++;
          else if (i.lang === 'Inglés') countEN++;
          else countALL++;
        });

        // 2. Title Row
        sheet.mergeCells('B2:G2');
        const titleCell = sheet.getCell('B2');
        titleCell.value = 'APORTE MATEMÁTICO - REPORTE EJECUTIVO DE ACCESOS';
        titleCell.font = { name: 'Arial', size: 14, bold: true, color: { argb: 'FF1A202C' } };
        titleCell.alignment = { vertical: 'middle', horizontal: 'left' };
        sheet.getRow(2).height = 25;

        // 3. Meta Row (Date)
        sheet.mergeCells('B3:G3');
        const metaCell = sheet.getCell('B3');
        const dateStr = new Date().toLocaleString('es-NI');
        metaCell.value = `Documento generado el: ${dateStr}`;
        metaCell.font = { name: 'Arial', size: 10, italic: true, color: { argb: 'FF718096' } };
        metaCell.alignment = { vertical: 'middle', horizontal: 'left' };

        // 4. Metrics Dashboard (H2:I6)
        sheet.mergeCells('H2:I2');
        const dashTitle = sheet.getCell('H2');
        dashTitle.value = 'MÉTRICAS DE VENTA';
        dashTitle.font = { name: 'Arial', size: 9, bold: true, color: { argb: 'FFFFFFFF' } };
        dashTitle.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2D3748' } };
        dashTitle.alignment = { vertical: 'middle', horizontal: 'center' };
        
        const metrics = [
          { row: 3, label: 'Solo Español:', val: countES },
          { row: 4, label: 'Solo Inglés:', val: countEN },
          { row: 5, label: 'Ambos (Bundle):', val: countALL },
          { row: 6, label: 'Total Códigos:', val: list.length }
        ];
        metrics.forEach(m => {
          const lCell = sheet.getCell(`H${m.row}`);
          const vCell = sheet.getCell(`I${m.row}`);
          lCell.value = m.label;
          vCell.value = m.val;
          lCell.font = { name: 'Arial', size: 9, color: { argb: 'FF4A5568' } };
          vCell.font = { name: 'Arial', size: 10, bold: true, color: { argb: 'FF1A202C' } };
          lCell.border = { bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } } };
          vCell.border = { bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } } };
          vCell.alignment = { vertical: 'middle', horizontal: 'right' };
        });

        // 5. Table Header
        const headerRow = sheet.getRow(8);
        headerRow.values = [null, 'FECHA DE CREACIÓN', 'NOMBRE DEL CLIENTE', 'TELÉFONO', 'IDIOMA', 'CÓDIGO DE DESBLOQUEO', 'ESTADO / NOTAS'];
        headerRow.height = 25;
        
        ['B', 'C', 'D', 'E', 'F', 'G'].forEach((col) => {
          const cell = sheet.getCell(`${col}8`);
          cell.font = { name: 'Arial', size: 9, bold: true, color: { argb: 'FFFFFFFF' } };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF2D3748' } };
          cell.alignment = { vertical: 'middle', horizontal: 'center' };
          if (col === 'C') cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
        });

        // Auto-Filter for the table
        sheet.autoFilter = 'B8:G8';

        // 6. Data Rows
        let currentRow = 9;
        list.forEach((item) => {
          const row = sheet.getRow(currentRow);
          row.values = [null, item.date, item.name, item.phone || 'N/A', item.lang, item.code, ''];
          row.height = 22;

          ['B', 'C', 'D', 'E', 'F', 'G'].forEach((col) => {
            const cell = sheet.getCell(`${col}${currentRow}`);
            cell.font = { name: 'Arial', size: 10, color: { argb: 'FF2D3748' } };
            cell.alignment = { vertical: 'middle', horizontal: 'center' };
            cell.border = { bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } } }; 
            
            if (col === 'C') {
              cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 1 };
            }
            if (col === 'F') { // Code
              cell.font = { name: 'Consolas', size: 10, bold: true, color: { argb: 'FF4A5568' } };
            }
            if (col === 'E') { // Language Colors
              if (item.lang === 'Español') {
                cell.font = { name: 'Arial', size: 10, bold: true, color: { argb: 'FF2B6CB0' } }; // Blue
              } else if (item.lang === 'Inglés') {
                cell.font = { name: 'Arial', size: 10, bold: true, color: { argb: 'FF2F855A' } }; // Green
              } else {
                cell.font = { name: 'Arial', size: 10, bold: true, color: { argb: 'FF6B46C1' } }; // Purple
              }
            }
            if (col === 'G') {
              cell.dataValidation = {
                type: 'list',
                allowBlank: true,
                formulae: ['"Pendiente,Pagado,Entregado,Revocado"']
              };
            }
          });
          currentRow++;
        });

        // ============================================
        // 7. Segunda Hoja: Dashboard Analítico Matemático
        // ============================================
        const sheet2 = workbook.addWorksheet('Dashboard KPIs', {
          views: [{ showGridLines: false }]
        });
        
        sheet2.columns = [
          { width: 3 },  // A (Buffer)
          { width: 22 }, // B (KPI 1)
          { width: 3 },  // C (Space)
          { width: 22 }, // D (KPI 2)
          { width: 3 },  // E (Space)
          { width: 22 }, // F (KPI 3)
          { width: 3 },  // G (Space)
          { width: 22 }, // H (KPI 4)
        ];
        
        // Título del Dashboard
        sheet2.mergeCells('B2:H2');
        const s2Title = sheet2.getCell('B2');
        s2Title.value = 'INDICADORES CLAVE DE RENDIMIENTO (KPIs)';
        s2Title.font = { name: 'Arial', size: 18, bold: true, color: { argb: 'FF1A202C' } };
        s2Title.alignment = { vertical: 'middle', horizontal: 'left' };
        sheet2.getRow(2).height = 30;
        sheet2.getRow(3).height = 10; // Espaciador

        // Función Helper para crear bloques KPI
        const createKPI = (col, label, formula, format, mainColor, numSize) => {
          // Encabezado del KPI
          sheet2.getCell(`${col}4`).value = label;
          sheet2.getCell(`${col}4`).font = { size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
          sheet2.getCell(`${col}4`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: mainColor } };
          sheet2.getCell(`${col}4`).alignment = { horizontal: 'center', vertical: 'middle' };
          sheet2.getRow(4).height = 25;
          
          // Valor del KPI (Número gigante)
          sheet2.mergeCells(`${col}5:${col}7`);
          const valCell = sheet2.getCell(`${col}5`);
          valCell.value = { formula: formula };
          if (format) valCell.numFmt = format;
          valCell.font = { name: 'Arial', size: numSize, bold: true, color: { argb: mainColor } };
          valCell.alignment = { vertical: 'middle', horizontal: 'center' };
          valCell.border = { 
            bottom: { style: 'medium', color: { argb: mainColor } }, 
            left: { style: 'medium', color: { argb: mainColor } }, 
            right: { style: 'medium', color: { argb: mainColor } } 
          };
        };

        // KPI 1: TOTAL GENERADOS
        createKPI('B', 'TOTAL CÓDIGOS', 'COUNTA(Registros!C9:C2000)', null, 'FF2D3748', 36);

        // KPI 2: BUNDLE RATIO
        createKPI('D', 'TASA DE BUNDLES', 'IF(B5=0, 0, COUNTIF(Registros!E9:E2000, "Español e Inglés") / B5)', '0.0%', 'FFD38D45', 36);

        // KPI 3: MERCADO ESPAÑOL
        createKPI('F', 'CUOTA ESPAÑOL', 'IF(B5=0, 0, COUNTIF(Registros!E9:E2000, "Español") / B5)', '0.0%', 'FF2B6CB0', 36);

        // KPI 4: MERCADO INGLÉS
        createKPI('H', 'CUOTA INGLÉS', 'IF(B5=0, 0, COUNTIF(Registros!E9:E2000, "Inglés") / B5)', '0.0%', 'FF2F855A', 36);

        // DETALLE DE VOLUMEN
        sheet2.getRow(10).height = 20;
        sheet2.mergeCells('B10:D10');
        sheet2.getCell('B10').value = 'DESGLOSE DE VOLUMEN EXACTO';
        sheet2.getCell('B10').font = { size: 12, bold: true, color: { argb: 'FF4A5568' } };
        sheet2.getCell('B10').border = { bottom: { style: 'thin', color: { argb: 'FF4A5568' } } };
        
        const details = [
          { row: 12, label: 'Solo Español (Unds):', form: 'COUNTIF(Registros!E9:E2000, "Español")' },
          { row: 13, label: 'Solo Inglés (Unds):', form: 'COUNTIF(Registros!E9:E2000, "Inglés")' },
          { row: 14, label: 'Paquete Bundle (Unds):', form: 'COUNTIF(Registros!E9:E2000, "Español e Inglés")' }
        ];

        details.forEach(d => {
          sheet2.getCell(`B${d.row}`).value = d.label;
          sheet2.getCell(`B${d.row}`).font = { size: 11, bold: true, color: { argb: 'FF718096' } };
          sheet2.getCell(`D${d.row}`).value = { formula: d.form };
          sheet2.getCell(`D${d.row}`).font = { size: 12, bold: true, color: { argb: 'FF2D3748' } };
          sheet2.getCell(`D${d.row}`).alignment = { horizontal: 'left' };
        });

        // Nota explicativa
        sheet2.mergeCells('B17:H17');
        const note = sheet2.getCell('B17');
        note.value = 'Nota Matemática: Los bloques de KPIs reaccionan en tiempo real. Si agregas o filtras registros, estas cifras se actualizarán solas.';
        note.font = { name: 'Arial', size: 9, italic: true, color: { argb: 'FFA0AEC0' } };

        // Generar archivo y forzar descarga
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        
        const fileDate = new Date().toISOString().split('T')[0];
        link.setAttribute("download", `Reporte_Claves_${fileDate}.xlsx`);
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
      } catch (err) {
        console.error(err);
        alert('Ocurrió un error al generar el archivo Excel.');
      }
    }

    document.addEventListener('DOMContentLoaded', renderHistory);
  </script>
</body>
</html>
