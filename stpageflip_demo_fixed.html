<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo StPageFlip 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at center, #2c2f33 0%, #111214 100%);
      font-family: sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .container {
      width: 90vw;
      height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #book {
      width: 100%;
      height: 100%;
    }

    .page {
      background-color: #fff;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
      width: 461px;
      height: 1178px;
    }
    
    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
    
    .page.--cover {
      background-color: #1a1a1a;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="book">
      <!-- Las páginas se inyectarán vía JS -->
    </div>
  </div>

  <!-- CDN de StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        const bookElement = document.getElementById('book');
        
        // Para la demo, inyectaremos 20 páginas (puedes cambiarlo a 168)
        const totalPages = 20; 
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            // Creamos divs planos como pide la librería
            html += `<div class="page"><img src="LIBROS/paginas_es/page_${i}.jpg" alt="Página ${i}"></div>`;
        }
        bookElement.innerHTML = html;

        // Aviso en consola si alguna imagen no carga (revisa la ruta LIBROS/paginas_es/ si ves esto)
        bookElement.querySelectorAll('img').forEach(img => {
            img.addEventListener('error', () => console.error('No se pudo cargar la imagen:', img.src));
        });

        let pageFlip;
        try {
            // Inicializamos el comportamiento del libro
            pageFlip = new St.PageFlip(bookElement, {
                width: 461,            // Ancho base de UNA página (mitad de 922)
                height: 1178,          // Alto base
                size: "stretch",       // "fixed" o "stretch" son los únicos valores válidos ("fit" no existe y rompía la inicialización)
                minWidth: 300,
                maxWidth: 1000,
                minHeight: 400,
                maxHeight: 1500,
                showCover: true,       // Comportamiento de tapa dura para primera/última página
                maxShadowOpacity: 0.5,
                drawShadow: true,      // Activa las sombras realistas del doblez
                flippingTime: 1000,    // Duración de la animación (ms)
                usePortrait: true,     // En pantallas pequeñas (móviles) muestra de a 1 página
                useMouseEvents: true,  // Permite arrastrar la esquina con mouse o touch
                swipeDistance: 30
            });

            // Le pasamos los elementos DOM a la librería
            pageFlip.loadFromHTML(document.querySelectorAll('.page'));
        } catch (err) {
            console.error('Error al inicializar StPageFlip:', err);
        }
    });
  </script>
</body>
</html>
